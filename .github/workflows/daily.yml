name: Yahoo Fantasy Daily Collector
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'America/Los_Angeles'
permissions:
  contents: write
concurrency:
  group: yahoo-fantasy-daily
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read Yahoo Fantasy
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_TOKEN_KEY: ${{ secrets.YAHOO_TOKEN_KEY }}
        run: python agent.py collect
      - name: Save refreshed encrypted token
        run: |
          if ! git diff --quiet -- token_state.enc; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add token_state.enc
            git commit -m 'Update encrypted Yahoo OAuth token'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: fantasy-report
          path: output/
          retention-days: 7
